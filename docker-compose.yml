

services:
  ollama_server:
    build:
      context: ./docker/ollama
    container_name: ollama_server
    restart: unless-stopped # Restart the container if it crashes
    pull_policy: always # Para asegurar que se descarguen los modelos
    tty: true # Para poder usar el contenedor como un terminal
    ports:
      - "11434:11434"       # Puerto de la API REST
    volumes:
      - ollama_data:/root/.ollama  # Persistir modelos y configuraciones
    # Activa esta línea si tienes GPU Nvidia y NVIDIA Container Toolkit instalado
    runtime: nvidia
    deploy:
       resources:
         reservations:
           devices:
             - driver: nvidia
               count: 1
               capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all   # Si usas GPU; permite ver todas las GPUs
    #command: ["sh", "-c", "ollama"]

    

  fastapi_app:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    container_name: fastapi_container
    ports:
      - "${FAST_API_PORT}:${FAST_API_PORT}"  # Host:Contenedor
    #command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      - TEST_MONGO_URI=mongodb://${TEST_MONGO_USER}:${TEST_MONGO_PASSWORD}@mongo:27017/?authSource=admin
      - PRODUCTION_MONGO_URI=${PRODUCTION_MONGO_URI}
      - OLLAMA_URL=http://ollama_server:11434
      - DEBUG=${DEBUG}
    depends_on:
      - ollama_server
      - mongo

  mongo:
   image: mongo
   environment:
     - MONGO_INITDB_ROOT_USERNAME=${TEST_MONGO_USER}
     - MONGO_INITDB_ROOT_PASSWORD=${TEST_MONGO_PASSWORD}
   ports:
     - "${TEST_MONGO_PORT}:27017"
   volumes:
     - mongo_data:/data/db

volumes:
  ollama_data:
  mongo_data:
